    <style>
        * {
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, rgba(255, 215, 0, 0.12) 0%, rgba(0, 255, 240, 0.05) 45%),
                        linear-gradient(160deg, #07080c 0%, #0f0d1a 55%, #050508 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .neon-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 255, 240, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 240, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at 50% 20%, rgba(0, 0, 0, 0.9), transparent 75%);
            opacity: 0.7;
            pointer-events: none;
            z-index: 0;
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 4px);
            mix-blend-mode: soft-light;
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        .card {
            background: linear-gradient(180deg, rgba(12, 13, 24, 0.96) 0%, rgba(16, 18, 34, 0.92) 100%);
            border: 2px solid rgba(0, 255, 240, 0.35);
            border-radius: 18px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 240, 0.08), inset 0 0 20px rgba(255, 215, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 215, 0, 0.08) 40%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 28px rgba(255, 215, 0, 0.25), 0 15px 30px rgba(0, 255, 240, 0.18);
        }

        .card:hover::after {
            opacity: 1;
        }

        .btn-play {
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .btn-play::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.5) 50%, transparent 100%);
            transition: left 0.45s ease;
        }

        .btn-play:hover::before {
            left: 120%;
        }

        .btn-play:hover {
            transform: scale(1.03);
        }

        .game-icon {
            font-size: 3.5rem;
            margin-bottom: 0.75rem;
            display: inline-block;
            animation: float 4s ease-in-out infinite alternate, glow 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(0, 255, 240, 0.5));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 16px rgba(255, 0, 110, 0.7)); }
        }

        .header-title {
            background: linear-gradient(135deg, #facc15 0%, #22d3ee 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 32px rgba(250, 204, 21, 0.3);
            letter-spacing: 0.08em;
        }

        .marquee {
            border: 2px solid rgba(250, 204, 21, 0.5);
            border-radius: 999px;
            padding: 0.35rem 1.5rem;
            color: #facc15;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }

        .tab-btn {
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 255, 240, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            color: #07080c;
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
            font-weight: 900;
        }

        .tab-btn:hover:not(.active) {
            border-color: rgba(34, 211, 238, 0.8);
            background: rgba(34, 211, 238, 0.08);
        }
    </style>
</head>

        let activeCategory = 'all';

        // 渲染卡片列表
        function renderGames(filterText = '') {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            const filtered = gamesData.filter(game => {
                // 分類過濾
                const matchCategory = activeCategory === 'all' || game.category === activeCategory;
                // 關鍵字搜尋過濾
                const matchSearch = filterText === '' || 
                    game.title.toLowerCase().includes(filterText.toLowerCase()) ||
                    game.desc.toLowerCase().includes(filterText.toLowerCase()) ||
                    game.tags.some(t => t.toLowerCase().includes(filterText.toLowerCase()));

                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 font-bold">
                        沒有找到符合篩選條件的遊戲 👾
                    </div>
                `;
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card p-6 flex flex-col';
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="game-icon">${game.emoji}</div>
                        <h2 class="text-2xl font-black mb-2" style="color: ${game.color};">${game.title}</h2>
                        <p class="text-sm mb-4 leading-relaxed text-slate-350" style="color: #cbd5e1;">
                            ${game.desc}
                        </p>
                        <div class="space-y-2 text-sm mb-6 text-cyan-400">
                            <p>⏱️ <span class="font-semibold text-slate-300">遊戲時間</span>: ${game.time}</p>
                            <p>🎯 <span class="font-semibold text-slate-300">目標</span>: ${game.target}</p>
                            <p>📱 <span class="font-semibold text-slate-300">支援</span>: 電腦 / 手機觸控</p>
                        </div>
                    </div>
                    <a href="${game.link}" class="btn-play text-white font-bold py-3 px-6 rounded-lg w-full text-center inline-block relative z-10" 
                       style="background: ${game.btnBg}; border: 2px solid ${game.color};">
                        開始遊戲 →
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        // 分類過濾切換
        function filterCategory(category) {
            activeCategory = category;
            
            // 更新按鈕樣式
            const tabs = ['all', 'culture', 'nightmarket', 'action'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === category) {
                    btn.classList.add('active', 'font-black');
                    btn.classList.remove('text-cyan-400');
                } else {
                    btn.classList.remove('active', 'font-black');
                    btn.classList.add('text-cyan-400');
                }
            });

            // 觸發渲染
            const searchVal = document.getElementById('searchInput').value;
            renderGames(searchVal);
        }

        // 搜尋輸入監聽
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderGames(e.target.value);
        });

        // 初始渲染
        window.onload = () => {
            renderGames();
        };
    </script>
