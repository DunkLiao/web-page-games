<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣垃圾車追趕戰 - Trash Truck Chase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #0b0c10;
            color: #e2e8f0;
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 20px;
        }
        .btn-yellow {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #0b0c10;
            font-weight: 900;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #fef08a;
        }
        .btn-yellow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.3);
        }
        canvas {
            display: block;
            background: #111827;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- HUD -->
    <div class="fixed top-4 left-4 right-4 flex justify-between gap-4 pointer-events-none z-10 max-w-lg mx-auto">
        <!-- 丟中包數 -->
        <div class="glass px-4 py-2 flex items-center gap-3 pointer-events-auto">
            <span class="text-2xl">🗑️</span>
            <div>
                <div class="text-[9px] text-yellow-400 font-black uppercase tracking-widest">已投中</div>
                <div id="scoreLabel" class="text-xl font-black text-yellow-300">0 包</div>
            </div>
        </div>
        <!-- 垃圾袋剩餘 -->
        <div class="glass px-4 py-2 flex items-center gap-3 pointer-events-auto">
            <span class="text-2xl">🛍️</span>
            <div>
                <div class="text-[9px] text-yellow-400 font-black uppercase tracking-widest">剩餘垃圾</div>
                <div id="bagsLabel" class="text-xl font-black text-cyan-400">20/20</div>
            </div>
        </div>
        <!-- 生命值 -->
        <div class="glass px-4 py-2 flex items-center gap-3 pointer-events-auto">
            <span class="text-2xl">❤️</span>
            <div>
                <div class="text-[9px] text-yellow-400 font-black uppercase tracking-widest">體力</div>
                <div id="hpLabel" class="text-xl font-black text-red-400">❤️❤️❤️</div>
            </div>
        </div>
    </div>

    <!-- 遊戲主要區域 -->
    <div class="w-full max-w-2xl flex flex-col items-center gap-4 relative">
        <canvas id="gameCanvas" width="800" height="400" class="w-full rounded-2xl border-2 border-yellow-500 shadow-2xl"></canvas>

        <!-- 行動裝置虛擬按鍵 -->
        <div class="flex w-full justify-between items-center px-4 md:hidden">
            <div class="flex gap-2">
                <button id="btnUp" class="glass w-16 h-16 flex items-center justify-center text-3xl active:scale-95 select-none text-yellow-400 border-yellow-500/40">⬆️</button>
                <button id="btnDown" class="glass w-16 h-16 flex items-center justify-center text-3xl active:scale-95 select-none text-yellow-400 border-yellow-500/40">⬇️</button>
            </div>
            <button id="btnThrow" class="btn-yellow w-24 h-16 rounded-2xl flex items-center justify-center text-xl active:scale-95 select-none">丟垃圾 🛍️</button>
        </div>

        <div class="text-slate-400 text-xs text-center hidden md:block">
            鍵盤操作：使用 <span class="text-yellow-400 font-bold">↑ / ↓</span> 鍵切換車道，按 <span class="text-yellow-400 font-bold">空白鍵 (Space)</span> 投擲垃圾袋！
        </div>

        <!-- 返回選單 -->
        <button id="inGameResetBtn" class="glass px-4 py-2 text-xs font-bold text-yellow-300 flex items-center gap-1 hover:text-white transition-colors">
            <span>🏠 返回主選單</span>
        </button>
    </div>

    <!-- 選單 Overlay -->
    <div id="menuOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-6">
        <div class="glass p-8 rounded-[32px] shadow-2xl max-w-md w-full text-center border-2 border-yellow-500/50">
            <div class="text-6xl mb-4 animate-bounce">🚚</div>
            <h1 class="text-3xl font-black text-yellow-400 mb-2">台灣垃圾車追趕戰</h1>
            <p class="text-slate-300 text-xs mb-6 leading-relaxed">
                經典的「給愛麗絲」樂曲響起，垃圾車出發了！玩家必須在三車道的馬路上奔跑，一邊躲避路邊亂停的機車與三角錐，一邊將手中的垃圾袋精準丟入前方的垃圾車斗！
            </p>

            <!-- 設定區 -->
            <div class="space-y-4 mb-6 bg-slate-900/60 p-4 rounded-2xl border border-yellow-500/20 text-left text-sm">
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between font-bold text-yellow-300">
                        <span>垃圾車車速</span>
                        <span id="speedValue">中等</span>
                    </div>
                    <input type="range" id="speedSetting" min="1" max="3" step="1" value="2" class="w-full h-1.5 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-yellow-500">
                </div>
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between font-bold text-yellow-300">
                        <span>初始垃圾袋數</span>
                        <span id="bagsValue">20包</span>
                    </div>
                    <input type="range" id="bagsSetting" min="10" max="40" step="5" value="20" class="w-full h-1.5 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-yellow-500">
                </div>
            </div>

            <!-- 結算顯示 -->
            <div id="finalScoreArea" class="hidden mb-6 p-4 bg-yellow-500/10 rounded-2xl border border-yellow-500/30">
                <p class="text-yellow-400 text-[10px] font-black tracking-wider uppercase mb-1">本次投中次數</p>
                <p id="finalScore" class="text-4xl font-black text-yellow-300">0 包</p>
                <p id="finalComment" class="text-xs text-slate-300 font-bold mt-1">評價：再接再厲！</p>
            </div>

            <button id="startBtn" class="btn-yellow w-full py-4 rounded-xl text-lg shadow-lg">
                開始追垃圾車
            </button>
        </div>
    </div>

    <!-- Web Audio & Canvas 邏輯 -->
    <script>
        const AudioSynth = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            play(type) {
                this.init();
                if (!this.ctx) return;
                
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'throw') {
                    // 拋出垃圾袋 (滑音)
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    // 投中車斗 (叮鈴)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.setValueAtTime(880, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'crash') {
                    // 撞擊障礙物 (爆炸噪聲)
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            },
            playAlice() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                // 簡短播放給愛麗絲開頭旋律
                const melody = [
                    {f: 659.25, d: 0.2}, // E5
                    {f: 622.25, d: 0.2}, // D#5
                    {f: 659.25, d: 0.2}, // E5
                    {f: 622.25, d: 0.2}, // D#5
                    {f: 659.25, d: 0.2}, // E5
                    {f: 493.88, d: 0.2}, // B4
                    {f: 587.33, d: 0.2}, // D5
                    {f: 523.25, d: 0.2}, // C5
                    {f: 440.00, d: 0.4}  // A4
                ];
                let currentOffset = 0;
                melody.forEach(note => {
                    const oscNote = this.ctx.createOscillator();
                    const gainNote = this.ctx.createGain();
                    oscNote.type = 'sine';
                    oscNote.frequency.setValueAtTime(note.f, now + currentOffset);
                    oscNote.connect(gainNote);
                    gainNote.connect(this.ctx.destination);
                    gainNote.gain.setValueAtTime(0.15, now + currentOffset);
                    gainNote.gain.exponentialRampToValueAtTime(0.01, now + currentOffset + note.d);
                    oscNote.start(now + currentOffset);
                    oscNote.stop(now + currentOffset + note.d);
                    currentOffset += note.d + 0.02;
                });
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreLabel = document.getElementById('scoreLabel');
        const bagsLabel = document.getElementById('bagsLabel');
        const hpLabel = document.getElementById('hpLabel');

        const menuOverlay = document.getElementById('menuOverlay');
        const startBtn = document.getElementById('startBtn');
        const speedSetting = document.getElementById('speedSetting');
        const bagsSetting = document.getElementById('bagsSetting');
        const speedValueDisplay = document.getElementById('speedValue');
        const bagsValueDisplay = document.getElementById('bagsValue');
        
        const finalScoreArea = document.getElementById('finalScoreArea');
        const finalScore = document.getElementById('finalScore');
        const finalComment = document.getElementById('finalComment');
        const inGameResetBtn = document.getElementById('inGameResetBtn');

        // 行動按鈕
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnThrow = document.getElementById('btnThrow');

        const speedNames = ["慢速", "中等", "快速"];
        speedSetting.oninput = () => speedValueDisplay.innerText = speedNames[speedSetting.value - 1];
        bagsSetting.oninput = () => bagsValueDisplay.innerText = `${bagsSetting.value}包`;

        let isPlaying = false;
        let score = 0;
        let bagsLeft = 20;
        let hp = 3;
        let lane = 1; // 0: 上, 1: 中, 2: 下
        const laneY = [120, 200, 280]; // 車道Y座標

        let playerX = 150;
        let playerY = laneY[1];
        let targetY = laneY[1];

        let truckX = 580;
        let truckY = 160;

        let obstacles = [];
        let bags = [];
        let particles = [];
        let frameId;
        let obstacleTimer = 0;
        let roadOffset = 0;

        let baseSpeed = 5;

        // 初始化
        startBtn.onclick = () => {
            AudioSynth.init();
            AudioSynth.playAlice();

            score = 0;
            hp = 3;
            bagsLeft = parseInt(bagsSetting.value);
            lane = 1;
            playerY = laneY[1];
            targetY = laneY[1];
            
            const spd = parseInt(speedSetting.value);
            baseSpeed = spd === 1 ? 4 : spd === 2 ? 6 : 8;

            obstacles = [];
            bags = [];
            particles = [];
            obstacleTimer = 0;
            isPlaying = true;

            menuOverlay.classList.add('hidden');
            updateHUD();
            animate();
        };

        inGameResetBtn.onclick = () => {
            endGame();
        };

        // 操作監聽
        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            if (e.key === 'ArrowUp') {
                moveLane(-1);
            } else if (e.key === 'ArrowDown') {
                moveLane(1);
            } else if (e.key === ' ') {
                throwBag();
            }
        });

        btnUp.onclick = () => moveLane(-1);
        btnDown.onclick = () => moveLane(1);
        btnThrow.onclick = () => throwBag();

        function moveLane(dir) {
            lane = Math.max(0, Math.min(2, lane + dir));
            targetY = laneY[lane];
        }

        function throwBag() {
            if (bagsLeft <= 0) return;
            bagsLeft--;
            updateHUD();
            AudioSynth.play('throw');

            // 建立丟出的垃圾袋
            bags.push({
                x: playerX + 30,
                y: playerY,
                startX: playerX + 30,
                startY: playerY,
                targetX: truckX + 20,
                targetY: laneY[lane] - 30, // 投向垃圾車後斗
                t: 0,
                speed: 0.04
            });
        }

        function updateHUD() {
            scoreLabel.innerText = `${score} 包`;
            bagsLabel.innerText = `${bagsLeft} 包`;
            hpLabel.innerText = '❤️'.repeat(hp);
        }

        // 碰撞與更新
        function animate() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製背景 (馬路與車道線)
            roadOffset = (roadOffset - baseSpeed) % 60;
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, 80, canvas.width, 240);

            // 車道分界線
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            
            // 第一條分界線
            ctx.beginPath();
            ctx.moveTo(roadOffset, 160);
            ctx.lineTo(canvas.width + 60, 160);
            ctx.stroke();

            // 第二條分界線
            ctx.beginPath();
            ctx.moveTo(roadOffset, 240);
            ctx.lineTo(canvas.width + 60, 240);
            ctx.stroke();
            
            ctx.setLineDash([]); // 還原

            // 繪製路肩 (紅線)
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(0, 80);
            ctx.lineTo(canvas.width, 80);
            ctx.moveTo(0, 320);
            ctx.lineTo(canvas.width, 320);
            ctx.stroke();

            // 玩家平滑移動
            playerY += (targetY - playerY) * 0.2;

            // 繪製垃圾車 (🚚)
            ctx.save();
            ctx.font = '70px serif';
            ctx.fillText('🚚', truckX, truckY + 25);
            // 車斗後面標示垃圾籃子位置
            ctx.fillStyle = 'rgba(250, 204, 21, 0.4)';
            ctx.beginPath();
            ctx.arc(truckX + 15, laneY[lane] - 30, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 繪製玩家 (🏃)
            ctx.save();
            ctx.font = '45px serif';
            ctx.fillText('🏃', playerX - 20, playerY + 15);
            ctx.restore();

            // 生成障礙物
            obstacleTimer += 1;
            if (obstacleTimer > 60 + Math.random() * 40) {
                obstacleTimer = 0;
                const randLane = Math.floor(Math.random() * 3);
                const types = ['🛵', '🚧', '🐱'];
                const type = types[Math.floor(Math.random() * types.length)];
                obstacles.push({
                    x: canvas.width + 50,
                    y: laneY[randLane],
                    type: type,
                    lane: randLane,
                    size: 40
                });
            }

            // 更新與繪製障礙物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= baseSpeed;

                ctx.save();
                ctx.font = '35px serif';
                ctx.fillText(obs.type, obs.x - 15, obs.y + 12);
                ctx.restore();

                // 碰撞檢測 (玩家與障礙物)
                if (obs.lane === lane && Math.abs(obs.x - playerX) < 35 && Math.abs(obs.y - playerY) < 15) {
                    AudioSynth.play('crash');
                    hp--;
                    updateHUD();
                    obstacles.splice(i, 1);
                    createExplosion(playerX, playerY, '#ef4444');
                    
                    if (hp <= 0) {
                        endGame();
                        return;
                    }
                    continue;
                }

                // 移除超出畫面障礙物
                if (obs.x < -50) {
                    obstacles.splice(i, 1);
                }
            }

            // 更新與繪製拋出的垃圾袋
            for (let i = bags.length - 1; i >= 0; i--) {
                const b = bags[i];
                b.t += b.speed;

                // 拋物線插值計算
                const currentX = b.startX + (b.targetX - b.startX) * b.t;
                // y軸拋物線弧度
                const height = 80; // 拋物線最高點高度
                const currentY = b.startY + (b.targetY - b.startY) * b.t - Math.sin(b.t * Math.PI) * height;

                ctx.save();
                ctx.font = '28px serif';
                ctx.fillText('🛍️', currentX - 10, currentY + 10);
                ctx.restore();

                if (b.t >= 1) {
                    // 到達目標 (判斷是否與垃圾車當前車道一致)
                    if (b.targetY >= truckY - 40 && b.targetY <= truckY + 80) {
                        // 投中！
                        AudioSynth.play('hit');
                        score++;
                        updateHUD();
                        createExplosion(b.targetX, b.targetY, '#facc15');
                    } else {
                        // 落地沒進車斗
                        createExplosion(b.targetX, b.targetY + 30, '#9ca3af');
                    }
                    bags.splice(i, 1);

                    // 檢查遊戲結束 (無生命或垃圾扔完且畫面上沒有剩餘垃圾袋)
                    if (bagsLeft <= 0 && bags.length === 0) {
                        setTimeout(endGame, 1000);
                    }
                }
            }

            // 繪製粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // 重力
                p.alpha -= 0.05;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            frameId = requestAnimationFrame(animate);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 3,
                    size: 3 + Math.random() * 4,
                    color: color,
                    alpha: 1
                });
            }
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(frameId);

            finalScore.innerText = `${score} 包`;
            
            // 評價評分
            let comment = "再接再厲！沒追上垃圾車...🗑️";
            if (hp <= 0) {
                comment = "體力耗盡！撞到了路邊的機車 🚑";
            } else if (score >= 15) {
                comment = "環保大師！完美的精準投擲！🏆";
            } else if (score >= 8) {
                comment = "合格市民！垃圾都乖乖倒完了 👍";
            }
            finalComment.innerText = `評價：${comment}`;

            finalScoreArea.classList.remove('hidden');
            menuOverlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
