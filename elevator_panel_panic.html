<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>辦公大樓：電梯按鈕地獄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #e2e8f0;
      background: linear-gradient(160deg, #111827 0%, #1f2937 40%, #0f172a 100%);
      touch-action: manipulation;
    }
    .panel {
      background: #1e293b;
      border: 3px solid #475569;
      border-radius: 12px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.4);
    }
    .led-display {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #fbbf24;
      font-family: ui-monospace, monospace;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }
    .btn-panel {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid #64748b;
      background: radial-gradient(circle at 30% 30%, #94a3b8, #475569);
      color: #0f172a;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
      box-shadow: 0 4px 0 #1e293b, inset 0 2px 4px rgba(255,255,255,0.3);
      user-select: none;
    }
    .btn-panel:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e293b; }
    .btn-panel.lit {
      background: radial-gradient(circle at 30% 30%, #fde68a, #f59e0b);
      border-color: #fbbf24;
      box-shadow: 0 0 16px #fbbf24, 0 4px 0 #92400e;
      color: #78350f;
    }
    .btn-panel.fake {
      outline: 2px dashed #ef4444;
      outline-offset: 2px;
    }
    .btn-panel.func {
      background: radial-gradient(circle at 30% 30%, #86efac, #16a34a);
      font-size: 0.75rem;
    }
    .btn-panel.func.lit {
      background: radial-gradient(circle at 30% 30%, #bbf7d0, #22c55e);
      box-shadow: 0 0 16px #4ade80, 0 4px 0 #14532d;
    }
    .btn-main {
      background: linear-gradient(135deg, #fbbf24, #f97316);
      border: 2px solid #fde68a; color: #1c1917; font-weight: 900;
      border-radius: 10px; padding: 12px 20px; width: 100%; cursor: pointer;
    }
    .btn-secondary {
      background: #334155; border: 2px solid #64748b; color: #e2e8f0;
      border-radius: 10px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    input[type=range] { width: 100%; accent-color: #fbbf24; }
    .timer-bar {
      height: 8px; background: #334155; border-radius: 4px; overflow: hidden;
    }
    .timer-fill {
      height: 100%; background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444);
      width: 100%; transition: width 0.05s linear;
    }
  </style>
</head>
<body class="flex flex-col items-center p-4 pb-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">🏢🛗</div>
      <h1 class="text-2xl font-black text-amber-300">電梯按鈕地獄</h1>
      <p class="text-sm text-slate-400 mt-1">亮哪個按哪個 · 假按鈕別踩 · 撐過波次</p>
    </div>

    <div id="setup" class="panel p-5 mb-4">
      <h2 class="font-bold text-amber-200 mb-3">設定</h2>
      <label class="block text-sm mb-1">反應時限：<span id="timeVal">1.5</span> 秒</label>
      <input type="range" id="reactTime" min="0.8" max="2.5" step="0.1" value="1.5">
      <label class="block text-sm mt-3 mb-1">目標波次：<span id="waveVal">12</span></label>
      <input type="range" id="waves" min="6" max="20" step="1" value="12">
      <label class="block text-sm mt-3 mb-1">干擾頻率：<span id="noiseVal">中</span></label>
      <input type="range" id="noise" min="0" max="2" step="1" value="1">
      <p class="text-xs text-slate-400 mt-3">最高分：<span id="hsSetup">0</span></p>
      <button class="btn-main mt-4" id="startBtn">搭電梯</button>
      <a href="index.html" class="block text-center text-sm text-slate-400 mt-3 underline">← 回遊戲間</a>
    </div>

    <div id="game" class="hidden">
      <div class="led-display p-3 mb-3 flex justify-between text-sm">
        <span>波 <span id="wave">0</span>/<span id="maxWave">12</span></span>
        <span>分 <span id="score">0</span></span>
        <span>命 <span id="lives">3</span></span>
      </div>
      <div class="timer-bar mb-3"><div class="timer-fill" id="timerFill"></div></div>
      <div class="panel p-4 mb-3">
        <p class="led-display text-center py-3 mb-4 text-lg" id="prompt">—</p>
        <div class="grid grid-cols-3 gap-3" id="pad"></div>
        <p class="text-center text-sm mt-3 h-5 font-bold" id="statusMsg"></p>
      </div>
      <button class="btn-secondary" id="quitBtn">放棄回設定</button>
    </div>

    <div id="result" class="panel p-6 text-center hidden">
      <div class="text-5xl mb-2" id="resultEmoji">🚪</div>
      <h2 class="text-xl font-black text-amber-300 mb-2" id="resultTitle">到達</h2>
      <p class="text-lg mb-1">分數：<span id="finalScore" class="font-black text-yellow-300">0</span></p>
      <p class="text-sm text-slate-400 mb-4">最高分：<span id="finalHS">0</span></p>
      <button class="btn-main mb-2" id="againBtn">再搭一次</button>
      <a href="index.html" class="block text-sm text-slate-400 underline">← 回遊戲間</a>
    </div>
  </div>

  <script>
    const HS_KEY = 'elevator_panel_panic_hs';
    const $ = id => document.getElementById(id);
    const noiseLabels = ['低', '中', '高'];
    const FLOORS = ['B1', '1', '2', '3', '4', '5', '6', '7', '8'];
    const FUNCS = [
      { id: 'open', label: '開' },
      { id: 'close', label: '關' },
      { id: 'alarm', label: '緊急' }
    ];

    let score = 0, lives = 3, wave = 0, maxWaves = 12;
    let reactMs = 1500, noiseLevel = 1;
    let targetId = null, deadline = 0, raf = null, playing = false;
    let buttons = [];

    function loadHS() { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
    function saveHS(s) {
      const hs = loadHS();
      if (s > hs) { localStorage.setItem(HS_KEY, String(s)); return s; }
      return hs;
    }

    $('reactTime').oninput = e => $('timeVal').textContent = e.target.value;
    $('waves').oninput = e => $('waveVal').textContent = e.target.value;
    $('noise').oninput = e => $('noiseVal').textContent = noiseLabels[+e.target.value];
    $('hsSetup').textContent = loadHS();

    function buildPad() {
      const pad = $('pad');
      pad.innerHTML = '';
      buttons = [];
      FLOORS.forEach(f => {
        const b = document.createElement('button');
        b.className = 'btn-panel';
        b.textContent = f;
        b.dataset.id = 'f-' + f;
        b.onclick = () => onPress(b.dataset.id);
        pad.appendChild(b);
        buttons.push(b);
      });
      // Replace last 3 with funcs for a 3x4 feel - actually 9 floors is 3x3, add func row
    }

    function buildPadFull() {
      const pad = $('pad');
      pad.innerHTML = '';
      buttons = [];
      const items = [
        ...FLOORS.slice(0, 6).map(f => ({ id: 'f-' + f, label: f, func: false })),
        ...FUNCS.map(f => ({ id: f.id, label: f.label, func: true }))
      ];
      items.forEach(item => {
        const b = document.createElement('button');
        b.className = 'btn-panel' + (item.func ? ' func' : '');
        b.textContent = item.label;
        b.dataset.id = item.id;
        b.onclick = () => onPress(b.dataset.id);
        pad.appendChild(b);
        buttons.push(b);
      });
    }

    function clearLit() {
      buttons.forEach(b => {
        b.classList.remove('lit', 'fake');
      });
    }

    function pickTarget() {
      clearLit();
      const ids = buttons.map(b => b.dataset.id);
      targetId = ids[Math.floor(Math.random() * ids.length)];
      const targetBtn = buttons.find(b => b.dataset.id === targetId);
      targetBtn.classList.add('lit');

      // Interference: fake lit buttons
      const fakeCount = noiseLevel + (wave > maxWaves / 2 ? 1 : 0);
      const others = buttons.filter(b => b.dataset.id !== targetId);
      for (let i = 0; i < fakeCount && others.length; i++) {
        const idx = Math.floor(Math.random() * others.length);
        const fake = others.splice(idx, 1)[0];
        // Only show as "lit-ish" with fake outline after brief delay or as dashed
        if (Math.random() < 0.7) {
          fake.classList.add('fake');
          // Subtle wrong glow
          fake.style.boxShadow = '0 0 10px #ef4444';
        }
      }

      const label = targetBtn.textContent;
      $('prompt').textContent = `按下：${label}`;
      $('statusMsg').textContent = '';
      deadline = performance.now() + reactMs * (1 - Math.min(0.25, wave * 0.015));
      tickTimer();
    }

    function tickTimer() {
      if (!playing) return;
      const left = deadline - performance.now();
      const pct = Math.max(0, left / reactMs) * 100;
      $('timerFill').style.width = pct + '%';
      if (left <= 0) {
        miss('太慢了！');
        return;
      }
      raf = requestAnimationFrame(tickTimer);
    }

    function onPress(id) {
      if (!playing || !targetId) return;
      if (id === targetId) {
        cancelAnimationFrame(raf);
        const bonus = Math.ceil((deadline - performance.now()) / 100);
        score += 10 + Math.max(0, bonus);
        wave++;
        updateHUD();
        $('statusMsg').textContent = '正確 ✓';
        $('statusMsg').style.color = '#4ade80';
        buttons.forEach(b => { b.style.boxShadow = ''; });
        if (wave >= maxWaves) {
          setTimeout(() => endGame(true), 400);
          return;
        }
        setTimeout(() => { if (playing) pickTarget(); }, 350);
      } else {
        miss('按錯了！');
      }
    }

    function miss(msg) {
      cancelAnimationFrame(raf);
      targetId = null;
      lives--;
      score = Math.max(0, score - 8);
      updateHUD();
      $('statusMsg').textContent = msg;
      $('statusMsg').style.color = '#f87171';
      buttons.forEach(b => { b.style.boxShadow = ''; });
      clearLit();
      if (lives <= 0) {
        setTimeout(() => endGame(false), 500);
        return;
      }
      setTimeout(() => { if (playing) pickTarget(); }, 500);
    }

    function updateHUD() {
      $('wave').textContent = wave;
      $('maxWave').textContent = maxWaves;
      $('score').textContent = score;
      $('lives').textContent = lives;
    }

    function startGame() {
      reactMs = parseFloat($('reactTime').value) * 1000;
      maxWaves = parseInt($('waves').value, 10);
      noiseLevel = parseInt($('noise').value, 10);
      score = 0; lives = 3; wave = 0;
      playing = true;
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('game').classList.remove('hidden');
      buildPadFull();
      updateHUD();
      setTimeout(pickTarget, 400);
    }

    function endGame(win) {
      playing = false;
      cancelAnimationFrame(raf);
      const hs = saveHS(score);
      $('game').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('resultEmoji').textContent = win ? '🎊' : '😵';
      $('resultTitle').textContent = win ? '順利下樓！' : '電梯故障…';
      $('finalScore').textContent = score;
      $('finalHS').textContent = hs;
      $('hsSetup').textContent = hs;
    }

    function quit() {
      playing = false;
      cancelAnimationFrame(raf);
      $('game').classList.add('hidden');
      $('result').classList.add('hidden');
      $('setup').classList.remove('hidden');
    }

    $('startBtn').onclick = startGame;
    $('againBtn').onclick = startGame;
    $('quitBtn').onclick = quit;
  </script>
</body>
</html>
