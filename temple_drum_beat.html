<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>廟口陣頭：鼓點跟打</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #fef2f2;
      background: linear-gradient(180deg, #7f1d1d 0%, #991b1b 40%, #450a0a 100%);
      touch-action: manipulation;
    }
    .panel {
      background: rgba(69, 10, 10, 0.92);
      border: 3px solid #fbbf24;
      border-radius: 16px;
      box-shadow: 0 0 24px rgba(251, 191, 36, 0.3);
    }
    .btn-main {
      background: linear-gradient(135deg, #fbbf24, #ef4444);
      border: 2px solid #fef3c7; color: #450a0a; font-weight: 900;
      border-radius: 12px; padding: 12px 20px; width: 100%; cursor: pointer;
    }
    .btn-secondary {
      background: #7f1d1d; border: 2px solid #f87171; color: #fecaca;
      border-radius: 10px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .track {
      position: relative; height: 320px; background: #1c1917;
      border-radius: 12px; border: 2px solid #a16207; overflow: hidden;
    }
    .lane {
      position: absolute; top: 0; bottom: 0; width: 25%;
      border-right: 1px solid rgba(251,191,36,0.15);
    }
    .judge {
      position: absolute; left: 0; right: 0; bottom: 56px; height: 6px;
      background: #fbbf24; box-shadow: 0 0 12px #fbbf24; z-index: 5;
    }
    .note {
      position: absolute; width: 52px; height: 52px; margin-left: -26px;
      border-radius: 50%; border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 900; z-index: 3;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .hit-btns {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .hit-btn {
      aspect-ratio: 1; border-radius: 50%; border: 3px solid #fef3c7;
      font-weight: 900; font-size: 1.1rem; cursor: pointer; color: #450a0a;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    }
    .hit-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
    .spirit {
      height: 12px; background: #1c1917; border-radius: 6px; overflow: hidden; border: 1px solid #fbbf24;
    }
    .spirit-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #f87171, #fbbf24, #fde68a);
      transition: width 0.15s;
    }
    input[type=range] { width: 100%; accent-color: #fbbf24; }
  </style>
</head>
<body class="flex flex-col items-center p-4 pb-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">🥁🦁</div>
      <h1 class="text-2xl font-black text-amber-300">廟口陣頭：鼓點跟打</h1>
      <p class="text-sm text-red-100/70 mt-1">鼓點落下 · 踩準判定 · 氣勢全開</p>
    </div>

    <div id="setup" class="panel p-5 mb-4">
      <h2 class="font-bold text-amber-200 mb-3">設定</h2>
      <label class="block text-sm mb-1">速度：<span id="spdVal">中</span></label>
      <input type="range" id="speed" min="0" max="2" step="1" value="1">
      <label class="block text-sm mt-3 mb-1">判定寬容：<span id="tolVal">中</span></label>
      <input type="range" id="tol" min="0" max="2" step="1" value="1">
      <label class="block text-sm mt-3 mb-1">曲目長度：<span id="lenVal">40</span> 拍</label>
      <input type="range" id="length" min="20" max="60" step="5" value="40">
      <label class="flex items-center gap-2 text-sm mt-3">
        <input type="checkbox" id="sound" checked> 合成鼓聲（可關）
      </label>
      <p class="text-xs text-red-100/50 mt-3">最高分：<span id="hsSetup">0</span></p>
      <button class="btn-main mt-4" id="startBtn">起鼓！</button>
      <a href="index.html" class="block text-center text-sm text-red-100/50 mt-3 underline">← 回遊戲間</a>
    </div>

    <div id="game" class="hidden">
      <div class="flex justify-between text-sm font-bold mb-2">
        <span>分 <span id="score">0</span></span>
        <span>連擊 <span id="combo">0</span></span>
        <span>氣勢</span>
      </div>
      <div class="spirit mb-2"><div class="spirit-fill" id="spirit"></div></div>
      <div class="panel p-2 mb-3">
        <div class="track" id="track">
          <div class="lane" style="left:0%;background:rgba(239,68,68,0.08)"></div>
          <div class="lane" style="left:25%;background:rgba(251,191,36,0.08)"></div>
          <div class="lane" style="left:50%;background:rgba(34,197,94,0.08)"></div>
          <div class="lane" style="left:75%;background:rgba(59,130,246,0.08)"></div>
          <div class="judge"></div>
          <div id="notes"></div>
        </div>
        <p class="text-center text-sm font-bold mt-2 h-6" id="judgeText">—</p>
      </div>
      <div class="hit-btns mb-3">
        <button class="hit-btn" style="background:#f87171" data-lane="0">鼓</button>
        <button class="hit-btn" style="background:#fbbf24" data-lane="1">鑼</button>
        <button class="hit-btn" style="background:#4ade80" data-lane="2">鈸</button>
        <button class="hit-btn" style="background:#60a5fa" data-lane="3">哨</button>
      </div>
      <button class="btn-secondary" id="quitBtn">收鼓</button>
    </div>

    <div id="result" class="panel p-6 text-center hidden">
      <div class="text-5xl mb-2">🥁</div>
      <h2 class="text-xl font-black text-amber-300 mb-2" id="resultTitle">曲終</h2>
      <p class="text-lg mb-1">分數：<span id="finalScore" class="font-black text-yellow-300">0</span></p>
      <p class="text-sm mb-1">Perfect <span id="cP">0</span> · Good <span id="cG">0</span> · Miss <span id="cM">0</span></p>
      <p class="text-sm text-red-100/50 mb-4">最高分：<span id="finalHS">0</span></p>
      <button class="btn-main mb-2" id="againBtn">再打一回</button>
      <a href="index.html" class="block text-sm text-red-100/50 underline">← 回遊戲間</a>
    </div>
  </div>

  <script>
    const HS_KEY = 'temple_drum_beat_hs';
    const $ = id => document.getElementById(id);
    const labels = ['慢', '中', '快'];
    const tolLabels = ['嚴', '中', '鬆'];
    const LANE_X = [12.5, 37.5, 62.5, 87.5];

    let speedLv = 1, tolLv = 1, songLen = 40, soundOn = true;
    let score = 0, combo = 0, spirit = 0;
    let notes = [], playing = false, raf = null, startTs = 0;
    let cP = 0, cG = 0, cM = 0, spawned = 0, fallPxPerSec = 180;
    let audioCtx = null;

    function loadHS() { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
    function saveHS(s) {
      const hs = loadHS();
      if (s > hs) { localStorage.setItem(HS_KEY, String(s)); return s; }
      return hs;
    }

    $('speed').oninput = e => $('spdVal').textContent = labels[+e.target.value];
    $('tol').oninput = e => $('tolVal').textContent = tolLabels[+e.target.value];
    $('length').oninput = e => $('lenVal').textContent = e.target.value;
    $('hsSetup').textContent = loadHS();

    function beep(lane) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const freqs = [120, 220, 330, 440];
        o.frequency.value = freqs[lane];
        o.type = lane === 0 ? 'triangle' : 'square';
        g.gain.value = 0.08;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        o.stop(audioCtx.currentTime + 0.16);
      } catch (_) {}
    }

    function buildChart() {
      notes = [];
      const interval = [0.7, 0.5, 0.38][speedLv];
      fallPxPerSec = [140, 200, 280][speedLv];
      let t = 1.2;
      for (let i = 0; i < songLen; i++) {
        const lane = Math.floor(Math.random() * 4);
        // occasional double
        notes.push({ lane, time: t, hit: false, missed: false, el: null });
        if (Math.random() < 0.15) {
          let l2 = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
          notes.push({ lane: l2, time: t, hit: false, missed: false, el: null });
        }
        t += interval * (0.85 + Math.random() * 0.3);
      }
      notes.sort((a, b) => a.time - b.time);
    }

    function ensureEl(n) {
      if (n.el) return;
      const el = document.createElement('div');
      el.className = 'note';
      el.style.left = LANE_X[n.lane] + '%';
      el.style.background = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6'][n.lane];
      el.textContent = ['鼓', '鑼', '鈸', '哨'][n.lane];
      el.style.top = '-60px';
      $('notes').appendChild(el);
      n.el = el;
    }

    function loop(ts) {
      if (!playing) return;
      if (!startTs) startTs = ts;
      const t = (ts - startTs) / 1000;
      const trackH = $('track').clientHeight;
      const judgeY = trackH - 56;

      notes.forEach(n => {
        if (n.hit || n.missed) return;
        const travel = fallPxPerSec * (t - (n.time - judgeY / fallPxPerSec));
        // note should reach judge line at n.time
        const y = judgeY - (n.time - t) * fallPxPerSec;
        if (y > -80 && y < trackH + 40) {
          ensureEl(n);
          n.el.style.top = y - 26 + 'px';
        }
        if (t - n.time > [0.12, 0.18, 0.25][tolLv] && !n.hit) {
          n.missed = true;
          cM++;
          combo = 0;
          spirit = Math.max(0, spirit - 8);
          if (n.el) n.el.style.opacity = '0.2';
          $('judgeText').textContent = 'MISS';
          $('judgeText').style.color = '#f87171';
          updateHUD();
        }
      });

      // end when all notes processed and past last
      const last = notes[notes.length - 1];
      if (last && t > last.time + 1.5) {
        endGame();
        return;
      }
      raf = requestAnimationFrame(loop);
    }

    function hit(lane) {
      if (!playing) return;
      beep(lane);
      const t = (performance.now() - startTs) / 1000;
      const windowP = [0.06, 0.09, 0.13][tolLv];
      const windowG = [0.12, 0.18, 0.25][tolLv];
      let best = null, bestDt = 99;
      notes.forEach(n => {
        if (n.hit || n.missed || n.lane !== lane) return;
        const dt = Math.abs(n.time - t);
        if (dt < bestDt) { bestDt = dt; best = n; }
      });
      if (!best || bestDt > windowG) {
        combo = 0;
        $('judgeText').textContent = '空揮';
        $('judgeText').style.color = '#94a3b8';
        return;
      }
      best.hit = true;
      if (best.el) {
        best.el.style.transform = 'scale(1.3)';
        best.el.style.opacity = '0';
      }
      if (bestDt <= windowP) {
        cP++;
        combo++;
        score += 50 + combo * 2;
        spirit = Math.min(100, spirit + 6);
        $('judgeText').textContent = 'PERFECT';
        $('judgeText').style.color = '#fbbf24';
      } else {
        cG++;
        combo++;
        score += 25 + combo;
        spirit = Math.min(100, spirit + 3);
        $('judgeText').textContent = 'GOOD';
        $('judgeText').style.color = '#86efac';
      }
      updateHUD();
    }

    function updateHUD() {
      $('score').textContent = score;
      $('combo').textContent = combo;
      $('spirit').style.width = spirit + '%';
    }

    function startGame() {
      speedLv = parseInt($('speed').value, 10);
      tolLv = parseInt($('tol').value, 10);
      songLen = parseInt($('length').value, 10);
      soundOn = $('sound').checked;
      score = 0; combo = 0; spirit = 0; cP = 0; cG = 0; cM = 0;
      playing = true; startTs = 0;
      $('notes').innerHTML = '';
      buildChart();
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('game').classList.remove('hidden');
      updateHUD();
      $('judgeText').textContent = '預備…';
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    }

    function endGame() {
      playing = false;
      cancelAnimationFrame(raf);
      score += Math.floor(spirit);
      const hs = saveHS(score);
      $('game').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('resultTitle').textContent = spirit >= 70 ? '陣頭氣勢全開！' : '曲終人散';
      $('finalScore').textContent = score;
      $('cP').textContent = cP;
      $('cG').textContent = cG;
      $('cM').textContent = cM;
      $('finalHS').textContent = hs;
      $('hsSetup').textContent = hs;
    }

    function quit() {
      playing = false;
      cancelAnimationFrame(raf);
      $('game').classList.add('hidden');
      $('setup').classList.remove('hidden');
    }

    document.querySelectorAll('.hit-btn').forEach(b => {
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        hit(parseInt(b.dataset.lane, 10));
      });
    });
    window.addEventListener('keydown', e => {
      const map = { d: 0, f: 1, j: 2, k: 3, D: 0, F: 1, J: 2, K: 3 };
      if (map[e.key] !== undefined) hit(map[e.key]);
    });

    $('startBtn').onclick = startGame;
    $('againBtn').onclick = startGame;
    $('quitBtn').onclick = quit;
  </script>
</body>
</html>
