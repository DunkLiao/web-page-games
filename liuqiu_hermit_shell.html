<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小琉球潮間帶：寄居蟹換殼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #0c4a6e;
      background: linear-gradient(180deg, #bae6fd 0%, #67e8f9 40%, #2dd4bf 100%);
      touch-action: manipulation;
    }
    .panel {
      background: rgba(255,255,255,0.92);
      border: 3px solid #0ea5e9;
      border-radius: 18px;
      box-shadow: 0 6px 0 #0284c7;
    }
    .btn-main {
      background: linear-gradient(135deg, #2dd4bf, #0ea5e9);
      border: 3px solid #0c4a6e; color: #0c4a6e; font-weight: 900;
      border-radius: 14px; padding: 12px 20px; width: 100%; cursor: pointer;
      box-shadow: 0 4px 0 #0c4a6e;
    }
    .btn-secondary {
      background: #e0f2fe; border: 2px solid #38bdf8; color: #075985;
      border-radius: 12px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .grid-board {
      display: grid; gap: 3px; background: #0e7490; padding: 6px; border-radius: 12px;
    }
    .cell {
      aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; background: #99f6e4; position: relative;
    }
    .cell.rock { background: #64748b; }
    .cell.water { background: #38bdf8; }
    .cell.goal { background: #fde68a; box-shadow: inset 0 0 0 2px #f59e0b; }
    .cell.wave { background: #0369a1; animation: pulse 0.6s infinite; }
    @keyframes pulse {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }
    .pad {
      display: grid; grid-template-columns: 60px 60px 60px; gap: 8px; justify-content: center;
    }
    .pad button {
      width: 60px; height: 60px; border-radius: 12px; border: 3px solid #0c4a6e;
      background: #f0fdfa; font-size: 1.4rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 3px 0 #0c4a6e;
    }
    .pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0c4a6e; }
    input[type=range] { width: 100%; accent-color: #14b8a6; }
  </style>
</head>
<body class="flex flex-col items-center p-4 pb-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">🦀🐚</div>
      <h1 class="text-2xl font-black text-cyan-900">小琉球潮間帶：寄居蟹換殼</h1>
      <p class="text-sm text-cyan-900/70 mt-1">換大殼 · 躲浪與鳥 · 抵達潮池</p>
    </div>

    <div id="setup" class="panel p-5 mb-4">
      <h2 class="font-bold text-cyan-800 mb-3">設定</h2>
      <label class="block text-sm mb-1">地圖大小：<span id="sizeVal">7</span></label>
      <input type="range" id="mapSize" min="6" max="9" step="1" value="7">
      <label class="block text-sm mt-3 mb-1">浪週期：<span id="waveVal">中</span></label>
      <input type="range" id="waveRate" min="0" max="2" step="1" value="1">
      <label class="block text-sm mt-3 mb-1">時限：<span id="timeVal">45</span> 秒</label>
      <input type="range" id="timeLimit" min="30" max="90" step="5" value="45">
      <p class="text-xs text-cyan-800/60 mt-3">最高分：<span id="hsSetup">0</span></p>
      <button class="btn-main mt-4" id="startBtn">退潮出發！</button>
      <a href="index.html" class="block text-center text-sm text-cyan-800/60 mt-3 underline">← 回遊戲間</a>
    </div>

    <div id="game" class="hidden">
      <div class="flex justify-between text-sm font-bold mb-2 text-cyan-900">
        <span>⏱ <span id="time">45</span>s</span>
        <span>殼 Lv<span id="shellLv">1</span></span>
        <span>分 <span id="score">0</span></span>
        <span>❤️ <span id="hp">3</span></span>
      </div>
      <div class="panel p-2 mb-3">
        <div class="grid-board" id="board"></div>
        <p class="text-center text-sm font-bold mt-2 h-5" id="statusMsg">用方向鍵或按鈕移動</p>
      </div>
      <div class="pad mb-3">
        <div></div>
        <button id="up">↑</button>
        <div></div>
        <button id="left">←</button>
        <button id="down">↓</button>
        <button id="right">→</button>
      </div>
      <button class="btn-secondary" id="quitBtn">離開潮間帶</button>
    </div>

    <div id="result" class="panel p-6 text-center hidden">
      <div class="text-5xl mb-2" id="resultEmoji">🦀</div>
      <h2 class="text-xl font-black text-cyan-800 mb-2" id="resultTitle">結束</h2>
      <p class="text-lg mb-1">分數：<span id="finalScore" class="font-black text-teal-600">0</span></p>
      <p class="text-sm text-cyan-800/60 mb-4">最高分：<span id="finalHS">0</span></p>
      <button class="btn-main mb-2" id="againBtn">再爬一次</button>
      <a href="index.html" class="block text-sm text-cyan-800/60 underline">← 回遊戲間</a>
    </div>
  </div>

  <script>
    const HS_KEY = 'liuqiu_hermit_shell_hs';
    const $ = id => document.getElementById(id);
    const waveLabels = ['慢', '中', '快'];

    let N = 7, waveLv = 1, timeLimit = 45;
    let grid = [], px = 0, py = 0, shellLv = 1, hp = 3, score = 0;
    let timeLeft = 45, playing = false, timer = null, waveTimer = null;
    let shells = [], birds = [], waveCells = [], goal = { x: 0, y: 0 };

    function loadHS() { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
    function saveHS(s) {
      const hs = loadHS();
      if (s > hs) { localStorage.setItem(HS_KEY, String(s)); return s; }
      return hs;
    }

    $('mapSize').oninput = e => $('sizeVal').textContent = e.target.value;
    $('waveRate').oninput = e => $('waveVal').textContent = waveLabels[+e.target.value];
    $('timeLimit').oninput = e => $('timeVal').textContent = e.target.value;
    $('hsSetup').textContent = loadHS();

    function genMap() {
      grid = Array.from({ length: N }, () => Array(N).fill('.'));
      // rocks
      for (let i = 0; i < N * 1.2; i++) {
        const x = Math.floor(Math.random() * N);
        const y = Math.floor(Math.random() * N);
        if ((x === 0 && y === N - 1) || (x === N - 1 && y === 0)) continue;
        grid[y][x] = 'R';
      }
      px = 0; py = N - 1;
      goal = { x: N - 1, y: 0 };
      grid[py][px] = '.';
      grid[goal.y][goal.x] = 'G';
      shells = [];
      const shellCount = 2 + Math.floor(N / 3);
      for (let i = 0; i < shellCount; i++) {
        let x, y, tries = 0;
        do {
          x = Math.floor(Math.random() * N);
          y = Math.floor(Math.random() * N);
          tries++;
        } while ((grid[y][x] !== '.' || (x === px && y === py) || (x === goal.x && y === goal.y) || shells.some(s => s.x === x && s.y === y)) && tries < 50);
        if (tries < 50) shells.push({ x, y, lv: 1 + Math.floor(Math.random() * 3), taken: false });
      }
      birds = [];
      const birdCount = 1 + Math.floor(N / 4);
      for (let i = 0; i < birdCount; i++) {
        birds.push({
          x: Math.floor(Math.random() * N),
          y: Math.floor(Math.random() * N),
          dir: Math.random() < 0.5 ? 1 : -1
        });
      }
      waveCells = [];
    }

    function render() {
      const board = $('board');
      board.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
      board.innerHTML = '';
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (grid[y][x] === 'R') cell.classList.add('rock');
          if (x === goal.x && y === goal.y) cell.classList.add('goal');
          if (waveCells.some(w => w.x === x && w.y === y)) cell.classList.add('wave');

          let content = '';
          if (x === px && y === py) content = shellLv >= 3 ? '🦞' : '🦀';
          else if (x === goal.x && y === goal.y) content = '🌊';
          else if (grid[y][x] === 'R') content = '🪨';
          else {
            const sh = shells.find(s => !s.taken && s.x === x && s.y === y);
            if (sh) content = sh.lv >= 3 ? '🐚' : '🦪';
            const bird = birds.find(b => b.x === x && b.y === y);
            if (bird) content = content ? content : '🐦';
            if (waveCells.some(w => w.x === x && w.y === y)) content = content || '🌊';
          }
          cell.textContent = content;
          board.appendChild(cell);
        }
      }
      $('shellLv').textContent = shellLv;
      $('score').textContent = score;
      $('hp').textContent = hp;
      $('time').textContent = Math.ceil(timeLeft);
    }

    function move(dx, dy) {
      if (!playing) return;
      const nx = px + dx, ny = py + dy;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) return;
      if (grid[ny][nx] === 'R') return;
      px = nx; py = ny;

      // shell pickup
      const sh = shells.find(s => !s.taken && s.x === px && s.y === py);
      if (sh && sh.lv > shellLv) {
        shellLv = sh.lv;
        sh.taken = true;
        score += sh.lv * 15;
        $('statusMsg').textContent = `換到 Lv${shellLv} 大殼！`;
      } else if (sh && !sh.taken) {
        sh.taken = true;
        score += 5;
        $('statusMsg').textContent = '撿到小殼（已有更大的）';
      }

      // wave damage
      if (waveCells.some(w => w.x === px && w.y === py)) {
        hurt('被浪打到！');
      }

      // bird
      if (birds.some(b => b.x === px && b.y === py)) {
        if (shellLv >= 2) {
          $('statusMsg').textContent = '厚殼擋住海鳥！';
          score += 5;
        } else {
          hurt('被海鳥啄了！');
        }
      }

      // goal
      if (px === goal.x && py === goal.y) {
        score += 100 + shellLv * 20 + Math.ceil(timeLeft) * 2;
        endGame(true);
        return;
      }

      score += 1;
      render();
    }

    function hurt(msg) {
      const dmg = shellLv >= 3 ? 0 : shellLv >= 2 ? 1 : 1;
      if (shellLv >= 3 && Math.random() < 0.5) {
        $('statusMsg').textContent = msg + '（大殼減傷免疫）';
        return;
      }
      hp -= dmg || 1;
      $('statusMsg').textContent = msg;
      if (hp <= 0) endGame(false);
    }

    function tickWave() {
      if (!playing) return;
      // random row/col wave
      waveCells = [];
      if (Math.random() < 0.7) {
        const row = Math.floor(Math.random() * N);
        for (let x = 0; x < N; x++) waveCells.push({ x, y: row });
      } else {
        const col = Math.floor(Math.random() * N);
        for (let y = 0; y < N; y++) waveCells.push({ x: col, y });
      }
      if (waveCells.some(w => w.x === px && w.y === py)) {
        hurt('浪來了！');
      }
      // move birds
      birds.forEach(b => {
        b.x += b.dir;
        if (b.x <= 0 || b.x >= N - 1) b.dir *= -1;
        b.x = Math.max(0, Math.min(N - 1, b.x));
        if (Math.random() < 0.3) b.y = Math.max(0, Math.min(N - 1, b.y + (Math.random() < 0.5 ? 1 : -1)));
      });
      render();
      setTimeout(() => {
        waveCells = [];
        if (playing) render();
      }, 600);
    }

    function startGame() {
      N = parseInt($('mapSize').value, 10);
      waveLv = parseInt($('waveRate').value, 10);
      timeLimit = parseInt($('timeLimit').value, 10);
      shellLv = 1; hp = 3; score = 0; timeLeft = timeLimit;
      playing = true;
      genMap();
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('game').classList.remove('hidden');
      render();
      clearInterval(timer);
      clearInterval(waveTimer);
      timer = setInterval(() => {
        timeLeft -= 0.2;
        if (timeLeft <= 0) { timeLeft = 0; endGame(false); return; }
        $('time').textContent = Math.ceil(timeLeft);
      }, 200);
      const waveMs = [3200, 2200, 1500][waveLv];
      waveTimer = setInterval(tickWave, waveMs);
    }

    function endGame(win) {
      playing = false;
      clearInterval(timer);
      clearInterval(waveTimer);
      const hs = saveHS(score);
      $('game').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('resultEmoji').textContent = win ? '🏆' : '🌊';
      $('resultTitle').textContent = win ? '抵達潮池！' : (hp <= 0 ? '撐不住了…' : '漲潮了…');
      $('finalScore').textContent = score;
      $('finalHS').textContent = hs;
      $('hsSetup').textContent = hs;
    }

    function quit() {
      playing = false;
      clearInterval(timer);
      clearInterval(waveTimer);
      $('game').classList.add('hidden');
      $('setup').classList.remove('hidden');
    }

    $('up').onclick = () => move(0, -1);
    $('down').onclick = () => move(0, 1);
    $('left').onclick = () => move(-1, 0);
    $('right').onclick = () => move(1, 0);
    window.addEventListener('keydown', e => {
      if (!playing) return;
      if (e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); move(0, -1); }
      if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); move(0, 1); }
      if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); move(-1, 0); }
      if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); move(1, 0); }
    });

    $('startBtn').onclick = startGame;
    $('againBtn').onclick = startGame;
    $('quitBtn').onclick = quit;
  </script>
</body>
</html>
