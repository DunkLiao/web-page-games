<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手搖店特調：配方記憶</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #422006;
      background: linear-gradient(160deg, #fce7f3 0%, #fef3c7 45%, #fde68a 100%);
      touch-action: manipulation;
    }
    .panel {
      background: rgba(255,255,255,0.92);
      border: 3px solid #f472b6;
      border-radius: 20px;
      box-shadow: 0 8px 0 #db2777, 0 12px 24px rgba(219,39,119,0.2);
    }
    .btn-main {
      background: linear-gradient(135deg, #f472b6, #fb923c);
      border: 3px solid #9d174d; color: white; font-weight: 900;
      border-radius: 14px; padding: 12px 20px; width: 100%; cursor: pointer;
      box-shadow: 0 4px 0 #9d174d;
    }
    .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #9d174d; }
    .btn-secondary {
      background: #fdf2f8; border: 2px solid #f9a8d4; color: #9d174d;
      border-radius: 12px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .chip {
      border: 3px solid #831843; border-radius: 14px; padding: 12px 8px;
      background: #fff; font-weight: 900; cursor: pointer; text-align: center;
      transition: transform 0.1s, background 0.15s;
      box-shadow: 0 3px 0 #831843;
    }
    .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #831843; }
    .chip.selected { background: #fce7f3; border-color: #db2777; }
    .chip.wrong { background: #fecaca; animation: shake 0.3s; }
    .chip.ok { background: #bbf7d0; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .order-card {
      background: #fff7ed; border: 3px dashed #f97316; border-radius: 16px;
      padding: 16px; text-align: center; min-height: 100px;
    }
    input[type=range] { width: 100%; accent-color: #f472b6; }
  </style>
</head>
<body class="flex flex-col items-center p-4 pb-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">🧋✨</div>
      <h1 class="text-2xl font-black text-pink-700">手搖店特調：配方記憶</h1>
      <p class="text-sm text-amber-900/70 mt-1">記住訂單 · 依序點配料 · 出杯得分</p>
    </div>

    <div id="setup" class="panel p-5 mb-4">
      <h2 class="font-bold text-pink-700 mb-3">設定</h2>
      <label class="block text-sm mb-1">記憶秒數：<span id="memVal">3</span></label>
      <input type="range" id="memTime" min="1.5" max="5" step="0.5" value="3">
      <label class="block text-sm mt-3 mb-1">目標杯數：<span id="cupsVal">8</span></label>
      <input type="range" id="cups" min="5" max="15" step="1" value="8">
      <label class="block text-sm mt-3 mb-1">配料複雜度：<span id="compVal">2 項</span></label>
      <input type="range" id="complexity" min="2" max="4" step="1" value="2">
      <p class="text-xs text-pink-800/60 mt-3">最高分：<span id="hsSetup">0</span></p>
      <button class="btn-main mt-4" id="startBtn">開店！</button>
      <a href="index.html" class="block text-center text-sm text-pink-800/60 mt-3 underline">← 回遊戲間</a>
    </div>

    <div id="game" class="hidden">
      <div class="flex justify-between text-sm font-bold mb-3 text-pink-800">
        <span>杯 <span id="done">0</span>/<span id="maxCups">8</span></span>
        <span>分 <span id="score">0</span></span>
        <span>連對 <span id="streak">0</span></span>
      </div>
      <div class="panel p-4 mb-3">
        <div class="order-card mb-3">
          <div class="text-xs text-orange-600 font-bold mb-1">顧客訂單</div>
          <div id="orderShow" class="text-lg font-black text-pink-800">—</div>
          <div id="phaseHint" class="text-xs mt-2 text-amber-800/70">記住配方…</div>
        </div>
        <div class="flex flex-wrap gap-2 mb-3 min-h-[40px]" id="built"></div>
        <div class="grid grid-cols-3 gap-2" id="ingredients"></div>
        <p class="text-center text-sm mt-3 font-bold h-5" id="statusMsg"></p>
      </div>
      <button class="btn-secondary" id="quitBtn">打烊回設定</button>
    </div>

    <div id="result" class="panel p-6 text-center hidden">
      <div class="text-5xl mb-2" id="resultEmoji">🧋</div>
      <h2 class="text-xl font-black text-pink-700 mb-2" id="resultTitle">打烊</h2>
      <p class="text-lg mb-1">分數：<span id="finalScore" class="font-black text-orange-600">0</span></p>
      <p class="text-sm text-pink-800/60 mb-4">最高分：<span id="finalHS">0</span></p>
      <button class="btn-main mb-2" id="againBtn">再開一輪</button>
      <a href="index.html" class="block text-sm text-pink-800/60 underline">← 回遊戲間</a>
    </div>
  </div>

  <script>
    const HS_KEY = 'bubble_tea_memory_hs';
    const $ = id => document.getElementById(id);

    const SUGAR = [
      { id: 's0', label: '無糖', emoji: '💧' },
      { id: 's50', label: '半糖', emoji: '🍬' },
      { id: 's100', label: '全糖', emoji: '🍭' }
    ];
    const ICE = [
      { id: 'i0', label: '去冰', emoji: '🌡️' },
      { id: 'i50', label: '微冰', emoji: '🧊' },
      { id: 'i100', label: '正常冰', emoji: '❄️' }
    ];
    const TOP = [
      { id: 't_boba', label: '波霸', emoji: '🟤' },
      { id: 't_pudding', label: '布丁', emoji: '🍮' },
      { id: 't_jelly', label: '椰果', emoji: '⚪' },
      { id: 't_none', label: '無料', emoji: '🚫' }
    ];
    const TEA = [
      { id: 'tea_b', label: '紅茶', emoji: '🟥' },
      { id: 'tea_g', label: '綠茶', emoji: '🟢' },
      { id: 'tea_m', label: '奶茶', emoji: '🥛' },
      { id: 'tea_f', label: '水果茶', emoji: '🍓' }
    ];

    let memMs = 3000, maxCups = 8, complexity = 2;
    let score = 0, done = 0, streak = 0;
    let order = [], built = [], phase = 'setup', timer = null, playing = false;

    function loadHS() { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
    function saveHS(s) {
      const hs = loadHS();
      if (s > hs) { localStorage.setItem(HS_KEY, String(s)); return s; }
      return hs;
    }

    $('memTime').oninput = e => $('memVal').textContent = e.target.value;
    $('cups').oninput = e => $('cupsVal').textContent = e.target.value;
    $('complexity').oninput = e => $('compVal').textContent = e.target.value + ' 項';
    $('hsSetup').textContent = loadHS();

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function makeOrder() {
      const o = [pick(TEA)];
      if (complexity >= 2) o.push(pick(SUGAR));
      if (complexity >= 3) o.push(pick(ICE));
      if (complexity >= 4) o.push(pick(TOP));
      return o;
    }

    function allPool() {
      const pools = [TEA];
      if (complexity >= 2) pools.push(SUGAR);
      if (complexity >= 3) pools.push(ICE);
      if (complexity >= 4) pools.push(TOP);
      return pools.flat();
    }

    function showOrderText(items, hide = false) {
      if (hide) {
        $('orderShow').textContent = '❓ ？ ？ ？';
        return;
      }
      $('orderShow').textContent = items.map(i => i.emoji + i.label).join(' · ');
    }

    function renderBuilt() {
      $('built').innerHTML = built.map((b, i) =>
        `<span class="px-2 py-1 rounded-full bg-pink-100 border border-pink-300 text-xs font-bold">${i+1}. ${b.emoji}${b.label}</span>`
      ).join('');
    }

    function renderIngredients(enabled) {
      const grid = $('ingredients');
      grid.innerHTML = '';
      // show options for current step only
      const step = built.length;
      let options = [];
      if (step === 0) options = TEA;
      else if (step === 1 && complexity >= 2) options = SUGAR;
      else if (step === 2 && complexity >= 3) options = ICE;
      else if (step === 3 && complexity >= 4) options = TOP;
      else options = [];

      // shuffle display
      options = [...options].sort(() => Math.random() - 0.5);
      options.forEach(item => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.disabled = !enabled;
        b.innerHTML = `<div class="text-xl">${item.emoji}</div><div class="text-xs">${item.label}</div>`;
        b.onclick = () => choose(item, b);
        grid.appendChild(b);
      });
    }

    function nextCup() {
      order = makeOrder();
      built = [];
      phase = 'memorize';
      renderBuilt();
      renderIngredients(false);
      showOrderText(order, false);
      $('phaseHint').textContent = '記住配方…時間到後開始點選';
      $('statusMsg').textContent = '';
      clearTimeout(timer);
      timer = setTimeout(() => {
        phase = 'build';
        showOrderText(order, true);
        $('phaseHint').textContent = '依序點選配料出杯！';
        renderIngredients(true);
      }, memMs);
    }

    function choose(item, el) {
      if (phase !== 'build' || !playing) return;
      const expected = order[built.length];
      if (item.id === expected.id) {
        el.classList.add('ok');
        built.push(item);
        renderBuilt();
        if (built.length >= order.length) {
          // success
          streak++;
          const gain = 15 + streak * 5 + complexity * 3;
          score += gain;
          done++;
          updateHUD();
          $('statusMsg').textContent = `出杯成功！+${gain}`;
          $('statusMsg').style.color = '#15803d';
          phase = 'wait';
          renderIngredients(false);
          showOrderText(order, false);
          if (done >= maxCups) {
            setTimeout(() => endGame(true), 600);
            return;
          }
          timer = setTimeout(nextCup, 700);
        } else {
          renderIngredients(true);
        }
      } else {
        el.classList.add('wrong');
        streak = 0;
        score = Math.max(0, score - 5);
        updateHUD();
        $('statusMsg').textContent = '配方錯了，重來！';
        $('statusMsg').style.color = '#b91c1c';
        // show correct briefly then retry same order
        phase = 'wait';
        showOrderText(order, false);
        built = [];
        renderBuilt();
        renderIngredients(false);
        timer = setTimeout(() => {
          phase = 'memorize';
          $('phaseHint').textContent = '再記一次…';
          timer = setTimeout(() => {
            phase = 'build';
            showOrderText(order, true);
            $('phaseHint').textContent = '依序點選配料出杯！';
            renderIngredients(true);
            $('statusMsg').textContent = '';
          }, Math.max(1000, memMs * 0.7));
        }, 800);
      }
    }

    function updateHUD() {
      $('done').textContent = done;
      $('maxCups').textContent = maxCups;
      $('score').textContent = score;
      $('streak').textContent = streak;
    }

    function startGame() {
      memMs = parseFloat($('memTime').value) * 1000;
      maxCups = parseInt($('cups').value, 10);
      complexity = parseInt($('complexity').value, 10);
      score = 0; done = 0; streak = 0; playing = true;
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('game').classList.remove('hidden');
      updateHUD();
      nextCup();
    }

    function endGame(win) {
      playing = false;
      clearTimeout(timer);
      const hs = saveHS(score);
      $('game').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('resultEmoji').textContent = win ? '🎉' : '🧋';
      $('resultTitle').textContent = win ? '今日業績達標！' : '打烊了';
      $('finalScore').textContent = score;
      $('finalHS').textContent = hs;
      $('hsSetup').textContent = hs;
    }

    function quit() {
      playing = false;
      clearTimeout(timer);
      $('game').classList.add('hidden');
      $('setup').classList.remove('hidden');
    }

    $('startBtn').onclick = startGame;
    $('againBtn').onclick = startGame;
    $('quitBtn').onclick = quit;
  </script>
</body>
</html>
