<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夜市射氣球：蓄力瞄準版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #fef3c7;
      background: linear-gradient(180deg, #1a0533 0%, #4a044e 40%, #7c2d12 100%);
      touch-action: manipulation;
    }
    .panel {
      background: rgba(24, 10, 40, 0.92);
      border: 2px solid #f59e0b;
      border-radius: 16px;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.25);
    }
    .btn-main {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: 2px solid #fde68a; color: #1c1917; font-weight: 900;
      border-radius: 12px; padding: 12px 20px; width: 100%; cursor: pointer;
    }
    .btn-secondary {
      background: #3b0764; border: 2px solid #a855f7; color: #f3e8ff;
      border-radius: 10px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    canvas {
      width: 100%; display: block; border-radius: 12px;
      border: 2px solid #fbbf24; background: #0f172a; touch-action: none;
    }
    input[type=range] { width: 100%; accent-color: #f59e0b; }
    .gauge {
      height: 12px; background: #1e1b4b; border-radius: 6px; overflow: hidden; border: 1px solid #6366f1;
    }
    .gauge-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #facc15, #ef4444); }
  </style>
</head>
<body class="flex flex-col items-center p-4 pb-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">🏮🎈</div>
      <h1 class="text-2xl font-black text-amber-300">夜市射氣球</h1>
      <p class="text-sm text-amber-100/60 mt-1">調角度 · 蓄力發射 · 金氣球加倍 · 炸彈別打</p>
    </div>

    <div id="setup" class="panel p-5 mb-4">
      <h2 class="font-bold text-amber-200 mb-3">設定</h2>
      <label class="block text-sm mb-1">發數：<span id="shotsVal">12</span></label>
      <input type="range" id="shots" min="6" max="20" step="1" value="12">
      <label class="block text-sm mt-3 mb-1">風偏：<span id="windVal">中</span></label>
      <input type="range" id="wind" min="0" max="2" step="1" value="1">
      <label class="block text-sm mt-3 mb-1">氣球移動：</label>
      <select id="moving" class="w-full p-2 rounded-lg bg-purple-950 border border-amber-500 text-amber-100">
        <option value="0">靜止</option>
        <option value="1" selected>緩慢左右</option>
        <option value="2">較快移動</option>
      </select>
      <p class="text-xs text-amber-100/50 mt-3">最高分：<span id="hsSetup">0</span></p>
      <button class="btn-main mt-4" id="startBtn">開攤！</button>
      <a href="index.html" class="block text-center text-sm text-amber-100/50 mt-3 underline">← 回遊戲間</a>
    </div>

    <div id="game" class="hidden">
      <div class="flex justify-between text-sm mb-2 font-bold">
        <span>發數 <span id="left">12</span></span>
        <span>分 <span id="score">0</span></span>
        <span>擊破 <span id="popped">0</span></span>
      </div>
      <div class="panel p-2 mb-2">
        <canvas id="cv" width="360" height="420"></canvas>
      </div>
      <div class="mb-2">
        <div class="flex justify-between text-xs mb-1"><span>角度</span><span id="angVal">60°</span></div>
        <input type="range" id="angle" min="20" max="160" value="90">
      </div>
      <div class="mb-2">
        <div class="flex justify-between text-xs mb-1"><span>力道（按住蓄力）</span><span id="powVal">0%</span></div>
        <div class="gauge"><div class="gauge-fill" id="powFill"></div></div>
      </div>
      <button class="btn-main mb-2" id="fireBtn">按住蓄力 · 放開發射</button>
      <p class="text-center text-xs text-amber-100/60 mb-2" id="statusMsg">調整角度後蓄力發射</p>
      <button class="btn-secondary" id="quitBtn">收攤</button>
    </div>

    <div id="result" class="panel p-6 text-center hidden">
      <div class="text-5xl mb-2">🎯</div>
      <h2 class="text-xl font-black text-amber-300 mb-2" id="resultTitle">遊戲結束</h2>
      <p class="text-lg mb-1">分數：<span id="finalScore" class="font-black text-yellow-300">0</span></p>
      <p class="text-sm text-amber-100/50 mb-4">最高分：<span id="finalHS">0</span></p>
      <button class="btn-main mb-2" id="againBtn">再玩一輪</button>
      <a href="index.html" class="block text-sm text-amber-100/50 underline">← 回遊戲間</a>
    </div>
  </div>

  <script>
    const HS_KEY = 'night_market_balloon_hs';
    const $ = id => document.getElementById(id);
    const windLabels = ['無', '中', '強'];
    const cv = $('cv');
    const ctx = cv.getContext('2d');

    let maxShots = 12, windLevel = 1, moveLevel = 1;
    let shotsLeft = 12, score = 0, popped = 0;
    let balloons = [], dart = null, playing = false, raf = null;
    let power = 0, charging = false, chargeRaf = null;
    let wind = 0, t0 = 0;

    function loadHS() { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
    function saveHS(s) {
      const hs = loadHS();
      if (s > hs) { localStorage.setItem(HS_KEY, String(s)); return s; }
      return hs;
    }

    $('shots').oninput = e => $('shotsVal').textContent = e.target.value;
    $('wind').oninput = e => $('windVal').textContent = windLabels[+e.target.value];
    $('angle').oninput = e => $('angVal').textContent = e.target.value + '°';
    $('hsSetup').textContent = loadHS();

    function spawnBalloons() {
      balloons = [];
      const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#f97316', '#ec4899'];
      const rows = 3, cols = 5;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const roll = Math.random();
          let type = 'normal', pts = 10;
          if (roll > 0.88) { type = 'gold'; pts = 30; }
          else if (roll > 0.78) { type = 'bomb'; pts = -20; }
          balloons.push({
            bx: 40 + c * 70, by: 50 + r * 70,
            x: 0, y: 0, r: 22,
            phase: Math.random() * Math.PI * 2,
            color: type === 'gold' ? '#fbbf24' : type === 'bomb' ? '#1f2937' : colors[(r + c) % colors.length],
            type, pts, alive: true
          });
        }
      }
    }

    function updateBalloonPos(now) {
      const speed = [0, 0.8, 1.8][moveLevel];
      balloons.forEach(b => {
        if (!b.alive) return;
        b.x = b.bx + Math.sin(now / 500 * speed + b.phase) * 18 * speed;
        b.y = b.by + Math.cos(now / 700 * speed + b.phase) * 6 * speed;
      });
    }

    function draw(now) {
      const w = cv.width, h = cv.height;
      ctx.clearRect(0, 0, w, h);
      // sky / night market bg
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#1e1b4b');
      g.addColorStop(1, '#4c1d95');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      // lanterns
      ctx.font = '20px sans-serif';
      ctx.fillText('🏮', 20, 30);
      ctx.fillText('🏮', w - 40, 36);
      // ground
      ctx.fillStyle = '#422006';
      ctx.fillRect(0, h - 40, w, 40);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, h - 44, w, 6);

      // launcher
      const lx = w / 2, ly = h - 50;
      const ang = (parseInt($('angle').value, 10) * Math.PI) / 180;
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + Math.cos(Math.PI - ang) * 40, ly - Math.sin(Math.PI - ang) * 40);
      ctx.stroke();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(lx, ly, 10, 0, Math.PI * 2);
      ctx.fill();

      // aim guide
      if (!dart && playing) {
        ctx.strokeStyle = 'rgba(253,230,138,0.25)';
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        const guide = 80 + power * 1.2;
        ctx.lineTo(lx + Math.cos(Math.PI - ang) * guide, ly - Math.sin(Math.PI - ang) * guide);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      updateBalloonPos(now);
      balloons.forEach(b => {
        if (!b.alive) return;
        ctx.beginPath();
        ctx.fillStyle = b.color;
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.stroke();
        // string
        ctx.beginPath();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        ctx.moveTo(b.x, b.y + b.r);
        ctx.lineTo(b.x, b.y + b.r + 18);
        ctx.stroke();
        if (b.type === 'gold') {
          ctx.fillStyle = '#78350f';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('金', b.x, b.y + 4);
        } else if (b.type === 'bomb') {
          ctx.font = '14px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💣', b.x, b.y + 5);
        }
      });

      if (dart) {
        ctx.beginPath();
        ctx.fillStyle = '#e2e8f0';
        ctx.arc(dart.x, dart.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(dart.x, dart.y);
        ctx.lineTo(dart.x - dart.vx * 0.05, dart.y - dart.vy * 0.05);
        ctx.stroke();
      }
    }

    function fire() {
      if (!playing || dart || shotsLeft <= 0) return;
      const angDeg = parseInt($('angle').value, 10);
      const ang = (angDeg * Math.PI) / 180;
      const pow = Math.max(0.25, power / 100);
      const speed = 6 + pow * 14;
      const lx = cv.width / 2, ly = cv.height - 50;
      wind = (Math.random() - 0.5) * [0, 0.08, 0.16][windLevel];
      dart = {
        x: lx, y: ly,
        vx: Math.cos(Math.PI - ang) * speed,
        vy: -Math.sin(Math.PI - ang) * speed
      };
      shotsLeft--;
      power = 0;
      $('powFill').style.width = '0%';
      $('powVal').textContent = '0%';
      updateHUD();
    }

    function updateDart() {
      if (!dart) return;
      dart.vy += 0.18; // gravity
      dart.vx += wind;
      dart.x += dart.vx;
      dart.y += dart.vy;

      for (const b of balloons) {
        if (!b.alive) continue;
        const dx = dart.x - b.x, dy = dart.y - b.y;
        if (dx * dx + dy * dy < (b.r + 6) * (b.r + 6)) {
          b.alive = false;
          if (b.type === 'bomb') {
            score = Math.max(0, score + b.pts);
            // clear neighbors
            balloons.forEach(o => {
              if (!o.alive) return;
              const ddx = o.x - b.x, ddy = o.y - b.y;
              if (ddx * ddx + ddy * ddy < 90 * 90) {
                if (o.type !== 'bomb') { o.alive = false; popped++; score += Math.floor(o.pts / 2); }
              }
            });
            $('statusMsg').textContent = '打到炸彈！周圍一起爆 💥';
          } else {
            score += b.pts;
            popped++;
            $('statusMsg').textContent = b.type === 'gold' ? '金色大獎！+30' : `擊破！+${b.pts}`;
          }
          dart = null;
          updateHUD();
          checkEnd();
          return;
        }
      }

      if (dart.x < -20 || dart.x > cv.width + 20 || dart.y > cv.height + 20) {
        dart = null;
        $('statusMsg').textContent = '飛出場外…';
        checkEnd();
      }
    }

    function checkEnd() {
      const alive = balloons.some(b => b.alive && b.type !== 'bomb');
      if (shotsLeft <= 0 && !dart) endGame();
      else if (!alive && !dart) endGame();
    }

    function updateHUD() {
      $('left').textContent = shotsLeft;
      $('score').textContent = score;
      $('popped').textContent = popped;
    }

    function loop(now) {
      if (!playing) return;
      updateDart();
      draw(now);
      raf = requestAnimationFrame(loop);
    }

    function startCharge() {
      if (!playing || dart || shotsLeft <= 0) return;
      charging = true;
      const step = () => {
        if (!charging) return;
        power = Math.min(100, power + 1.8);
        $('powFill').style.width = power + '%';
        $('powVal').textContent = Math.round(power) + '%';
        chargeRaf = requestAnimationFrame(step);
      };
      chargeRaf = requestAnimationFrame(step);
    }
    function endCharge() {
      if (!charging) return;
      charging = false;
      cancelAnimationFrame(chargeRaf);
      fire();
    }

    function startGame() {
      maxShots = parseInt($('shots').value, 10);
      windLevel = parseInt($('wind').value, 10);
      moveLevel = parseInt($('moving').value, 10);
      shotsLeft = maxShots; score = 0; popped = 0; dart = null; power = 0;
      playing = true;
      spawnBalloons();
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('game').classList.remove('hidden');
      updateHUD();
      $('statusMsg').textContent = '調整角度後蓄力發射';
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    }

    function endGame() {
      playing = false;
      cancelAnimationFrame(raf);
      const hs = saveHS(score);
      $('game').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('resultTitle').textContent = popped > 0 ? '收攤結算！' : '一個都沒中…';
      $('finalScore').textContent = score;
      $('finalHS').textContent = hs;
      $('hsSetup').textContent = hs;
    }

    function quit() {
      playing = false;
      charging = false;
      cancelAnimationFrame(raf);
      cancelAnimationFrame(chargeRaf);
      $('game').classList.add('hidden');
      $('setup').classList.remove('hidden');
    }

    const fireBtn = $('fireBtn');
    fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); startCharge(); });
    fireBtn.addEventListener('pointerup', e => { e.preventDefault(); endCharge(); });
    fireBtn.addEventListener('pointerleave', () => { if (charging) endCharge(); });
    fireBtn.addEventListener('pointercancel', () => { charging = false; cancelAnimationFrame(chargeRaf); });

    $('startBtn').onclick = startGame;
    $('againBtn').onclick = startGame;
    $('quitBtn').onclick = quit;
  </script>
</body>
</html>
