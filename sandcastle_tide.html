<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沙堡加蓋：對抗漲潮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #0f172a;
      background: linear-gradient(180deg, #7dd3fc 0%, #fde68a 45%, #fcd34d 70%, #f59e0b 100%);
      touch-action: manipulation;
    }
    .panel {
      background: rgba(255,255,255,0.9);
      border: 3px solid #0ea5e9;
      border-radius: 18px;
      box-shadow: 0 8px 0 #0284c7;
    }
    .btn-main {
      background: linear-gradient(135deg, #38bdf8, #fbbf24);
      border: 3px solid #0c4a6e; color: #0c4a6e; font-weight: 900;
      border-radius: 14px; padding: 14px 20px; width: 100%; cursor: pointer;
      box-shadow: 0 4px 0 #0c4a6e; font-size: 1.05rem;
    }
    .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #0c4a6e; }
    .btn-secondary {
      background: #e0f2fe; border: 2px solid #38bdf8; color: #075985;
      border-radius: 12px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .btn-shell {
      background: #fef3c7; border: 2px solid #d97706; color: #92400e;
      border-radius: 12px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .scene {
      height: 280px; border-radius: 16px; overflow: hidden; position: relative;
      border: 3px solid #0369a1; background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 40%, #fde68a 70%, #fbbf24 100%);
    }
    .sea {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, #38bdf8, #0369a1);
      transition: height 0.4s ease;
      opacity: 0.85;
    }
    .castle {
      position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
      width: 100px; transition: height 0.15s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    }
    .castle-body {
      width: 80px; background: #fcd34d; border: 3px solid #b45309;
      border-radius: 6px 6px 0 0; position: relative;
      box-shadow: inset 0 4px 0 rgba(255,255,255,0.3);
    }
    .castle-top {
      width: 100px; height: 24px; display: flex; justify-content: space-between;
    }
    .battlement {
      width: 18px; height: 100%; background: #fbbf24; border: 2px solid #b45309; border-bottom: none;
    }
    .flag {
      position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
      font-size: 1.2rem;
    }
    .crab {
      position: absolute; font-size: 1.8rem; transition: left 0.3s, bottom 0.3s;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
    }
    .shell-icon {
      position: absolute; font-size: 1.4rem; animation: bob 1s ease-in-out infinite;
    }
    @keyframes bob {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    input[type=range] { width: 100%; accent-color: #0ea5e9; }
  </style>
</head>
<body class="flex flex-col items-center p-4 pb-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">🏰🌊</div>
      <h1 class="text-2xl font-black text-sky-900">沙堡加蓋：對抗漲潮</h1>
      <p class="text-sm text-sky-900/70 mt-1">堆沙加高 · 貝殼加固 · 撐過漲潮</p>
    </div>

    <div id="setup" class="panel p-5 mb-4">
      <h2 class="font-bold text-sky-800 mb-3">設定</h2>
      <label class="block text-sm mb-1">目標波數：<span id="waveVal">6</span></label>
      <input type="range" id="waves" min="4" max="12" step="1" value="6">
      <label class="block text-sm mt-3 mb-1">潮汐頻率：<span id="tideVal">中</span></label>
      <input type="range" id="tide" min="0" max="2" step="1" value="1">
      <label class="block text-sm mt-3 mb-1">堆沙效率：<span id="buildVal">中</span></label>
      <input type="range" id="build" min="0" max="2" step="1" value="1">
      <p class="text-xs text-sky-800/60 mt-3">最高分：<span id="hsSetup">0</span></p>
      <button class="btn-main mt-4" id="startBtn">開始堆沙！</button>
      <a href="index.html" class="block text-center text-sm text-sky-800/60 mt-3 underline">← 回遊戲間</a>
    </div>

    <div id="game" class="hidden">
      <div class="flex justify-between text-sm font-bold mb-2 text-sky-900">
        <span>波 <span id="wave">0</span>/<span id="maxWave">6</span></span>
        <span>高度 <span id="height">20</span></span>
        <span>分 <span id="score">0</span></span>
        <span>🛡️<span id="armor">0</span></span>
      </div>
      <div class="scene mb-3" id="scene">
        <div class="sea" id="sea" style="height:30px"></div>
        <div class="castle" id="castle">
          <div class="flag">🚩</div>
          <div class="castle-top">
            <div class="battlement"></div>
            <div class="battlement"></div>
            <div class="battlement"></div>
            <div class="battlement"></div>
          </div>
          <div class="castle-body" id="castleBody" style="height:40px"></div>
        </div>
        <div class="crab" id="crab" style="left:10%; bottom:40px; display:none">🦀</div>
        <div class="shell-icon" id="shellPick" style="left:70%; bottom:50px; display:none">🐚</div>
      </div>
      <p class="text-center text-sm font-bold mb-2 h-5 text-sky-900" id="statusMsg">點擊堆沙！</p>
      <button class="btn-main mb-2" id="buildBtn">🏖️ 堆沙！</button>
      <button class="btn-shell mb-2" id="shellBtn" disabled>🐚 貝殼加固（0）</button>
      <button class="btn-secondary" id="quitBtn">離開沙灘</button>
    </div>

    <div id="result" class="panel p-6 text-center hidden">
      <div class="text-5xl mb-2" id="resultEmoji">🏰</div>
      <h2 class="text-xl font-black text-sky-800 mb-2" id="resultTitle">結束</h2>
      <p class="text-lg mb-1">分數：<span id="finalScore" class="font-black text-amber-600">0</span></p>
      <p class="text-sm text-sky-800/60 mb-4">最高分：<span id="finalHS">0</span></p>
      <button class="btn-main mb-2" id="againBtn">再堆一座</button>
      <a href="index.html" class="block text-sm text-sky-800/60 underline">← 回遊戲間</a>
    </div>
  </div>

  <script>
    const HS_KEY = 'sandcastle_tide_hs';
    const $ = id => document.getElementById(id);
    const labels = ['慢', '中', '快'];
    const buildLabels = ['低', '中', '高'];

    let maxWaves = 6, tideLevel = 1, buildLevel = 1;
    let wave = 0, height = 20, score = 0, armor = 0, shells = 0;
    let playing = false, phase = 'build', timer = null, crabTimer = null;

    function loadHS() { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
    function saveHS(s) {
      const hs = loadHS();
      if (s > hs) { localStorage.setItem(HS_KEY, String(s)); return s; }
      return hs;
    }

    $('waves').oninput = e => $('waveVal').textContent = e.target.value;
    $('tide').oninput = e => $('tideVal').textContent = labels[+e.target.value];
    $('build').oninput = e => $('buildVal').textContent = buildLabels[+e.target.value];
    $('hsSetup').textContent = loadHS();

    function updateVisual() {
      const h = Math.min(160, 30 + height * 1.5);
      $('castleBody').style.height = h + 'px';
      $('height').textContent = Math.round(height);
      $('score').textContent = score;
      $('wave').textContent = wave;
      $('maxWave').textContent = maxWaves;
      $('armor').textContent = armor;
      $('shellBtn').textContent = `🐚 貝殼加固（${shells}）`;
      $('shellBtn').disabled = shells <= 0 || !playing || phase !== 'build';
    }

    function setSea(pct) {
      $('sea').style.height = (30 + pct * 120) + 'px';
    }

    function startBuildPhase() {
      phase = 'build';
      setSea(0.05);
      $('crab').style.display = 'none';
      $('statusMsg').textContent = '漲潮前快堆！貝殼可加固';
      $('statusMsg').style.color = '#0c4a6e';
      // spawn shell sometimes
      if (Math.random() < 0.55) {
        $('shellPick').style.display = 'block';
        $('shellPick').style.left = (20 + Math.random() * 60) + '%';
      } else {
        $('shellPick').style.display = 'none';
      }
      // crab raid chance
      if (Math.random() < 0.35 + tideLevel * 0.1) {
        clearTimeout(crabTimer);
        crabTimer = setTimeout(crabAttack, 1500 + Math.random() * 2000);
      }
      const buildWindow = [4500, 3500, 2600][tideLevel];
      clearTimeout(timer);
      timer = setTimeout(startTide, buildWindow);
      updateVisual();
    }

    function crabAttack() {
      if (!playing || phase !== 'build') return;
      const crab = $('crab');
      crab.style.display = 'block';
      crab.style.left = '5%';
      crab.style.bottom = '40px';
      setTimeout(() => {
        if (!playing || phase !== 'build') return;
        crab.style.left = '45%';
        setTimeout(() => {
          if (!playing || phase !== 'build') return;
          const dmg = 8 + tideLevel * 3;
          if (armor > 0) {
            armor = Math.max(0, armor - 1);
            $('statusMsg').textContent = '螃蟹來搗亂，護甲擋下！';
          } else {
            height = Math.max(5, height - dmg);
            $('statusMsg').textContent = `螃蟹拆沙！-${dmg} 高度`;
          }
          $('statusMsg').style.color = '#b91c1c';
          crab.style.left = '90%';
          updateVisual();
          setTimeout(() => { crab.style.display = 'none'; }, 400);
        }, 400);
      }, 50);
    }

    function startTide() {
      if (!playing) return;
      phase = 'tide';
      wave++;
      clearTimeout(crabTimer);
      $('shellPick').style.display = 'none';
      $('statusMsg').textContent = `第 ${wave} 波漲潮來了！`;
      $('statusMsg').style.color = '#0369a1';
      setSea(0.9);
      updateVisual();
      setTimeout(() => {
        if (!playing) return;
        let wash = 12 + tideLevel * 6 + wave * 2;
        if (armor > 0) {
          wash = Math.floor(wash * 0.45);
          armor--;
          $('statusMsg').textContent = `護甲減緩衝刷！高度 -${wash}`;
        } else {
          $('statusMsg').textContent = `潮水沖刷！高度 -${wash}`;
        }
        height = Math.max(0, height - wash);
        score += Math.round(height * 2 + wave * 5);
        setSea(0.15);
        updateVisual();
        if (height <= 0) {
          setTimeout(() => endGame(false), 500);
          return;
        }
        if (wave >= maxWaves) {
          score += 50 + Math.round(height);
          setTimeout(() => endGame(true), 500);
          return;
        }
        setTimeout(startBuildPhase, 700);
      }, 900);
    }

    function doBuild() {
      if (!playing || phase !== 'build') return;
      const gain = [4, 7, 11][buildLevel];
      height += gain;
      score += 2;
      $('statusMsg').textContent = `堆沙 +${gain}`;
      $('statusMsg').style.color = '#b45309';
      updateVisual();
    }

    function useShell() {
      if (!playing || phase !== 'build' || shells <= 0) return;
      shells--;
      armor += 2;
      height += 3;
      score += 5;
      $('statusMsg').textContent = '貝殼加固！護甲+2';
      $('statusMsg').style.color = '#a16207';
      updateVisual();
    }

    function pickShell() {
      if (!playing || phase !== 'build') return;
      if ($('shellPick').style.display === 'none') return;
      shells++;
      $('shellPick').style.display = 'none';
      $('statusMsg').textContent = '撿到貝殼！';
      updateVisual();
    }

    function startGame() {
      maxWaves = parseInt($('waves').value, 10);
      tideLevel = parseInt($('tide').value, 10);
      buildLevel = parseInt($('build').value, 10);
      wave = 0; height = 20; score = 0; armor = 0; shells = 1;
      playing = true;
      $('setup').classList.add('hidden');
      $('result').classList.add('hidden');
      $('game').classList.remove('hidden');
      updateVisual();
      startBuildPhase();
    }

    function endGame(win) {
      playing = false;
      clearTimeout(timer);
      clearTimeout(crabTimer);
      const hs = saveHS(score);
      $('game').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('resultEmoji').textContent = win ? '🏆' : '🌊';
      $('resultTitle').textContent = win ? '沙堡屹立不搖！' : '被潮水夷平…';
      $('finalScore').textContent = score;
      $('finalHS').textContent = hs;
      $('hsSetup').textContent = hs;
    }

    function quit() {
      playing = false;
      clearTimeout(timer);
      clearTimeout(crabTimer);
      $('game').classList.add('hidden');
      $('setup').classList.remove('hidden');
    }

    $('startBtn').onclick = startGame;
    $('againBtn').onclick = startGame;
    $('quitBtn').onclick = quit;
    $('buildBtn').onclick = doBuild;
    $('shellBtn').onclick = useShell;
    $('shellPick').onclick = pickShell;
    $('scene').addEventListener('click', e => {
      if (e.target.id === 'shellPick') return;
      // optional: click scene also builds
    });
  </script>
</body>
</html>
